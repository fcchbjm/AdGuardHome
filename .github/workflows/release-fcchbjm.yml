# 仅在 fork 仓库自动构建并发布 GitHub Release，与官方 AdguardTeam/AdGuardHome CI 隔离。
#
# 触发：推送符合 SemVer 的 tag（v*，例如 v0.1.0）。
# 请将两个 job 里的 github.repository 比较值改为你自己的「所有者/仓库名」。
#
# 官方仓库即使合并本文件也不会执行发布（repository 判断为假）；官方仍使用原有 build.yml 等流程。
#
# Fork 发行嵌入 client_v2（SolidJS，含 PPv2 DNS 设置）；Makefile 默认即为 client_v2。

'name': 'release (fork)'

'env':
  'GO_VERSION': '1.27.4'
  'NODE_VERSION': '24'

'on':
  'push':
    'tags':
    - 'v*'

'permissions':
  'contents': 'write'
  'packages': 'write'

'jobs':
  'test':
    # 改为你的 fork，例如 'fcchbjm/AdGuardHome'
    'if': "github.repository == 'fcchbjm/AdGuardHome'"
    'runs-on': 'ubuntu-latest'
    'env':
      'GO111MODULE': 'on'
      'GOPROXY': 'https://goproxy.cn|direct'
    'steps':
    - 'name': 'Checkout'
      'uses': 'actions/checkout@v7'
      'with':
        'fetch-depth': 0
    - 'name': 'Set up Go'
      # Don't add a manual actions/cache step for ~/go/pkg/mod: setup-go
      # already caches it (plus the build cache) and restores it first.
      # Restoring the same path twice makes GNU tar fail with
      # "Cannot open: File exists" on Go's read-only module directories.
      'uses': 'actions/setup-go@v7'
      'with':
        'go-version': '${{ env.GO_VERSION }}'
    - 'name': 'Set up Node'
      'uses': 'actions/setup-node@v7'
      'with':
        'node-version': '${{ env.NODE_VERSION }}'
    - 'name': 'Set up npm cache'
      'uses': 'actions/cache@v6'
      'with':
        'path': '~/.npm'
        'key': "${{ runner.os }}-node-${{ hashFiles('client_v2/package-lock.json') }}"
        'restore-keys': '${{ runner.os }}-node-'
    - 'name': 'Run tests'
      'run': 'make CLIENT_DIR=client_v2 VERBOSE=1 deps test'

  'release':
    'if': "github.repository == 'fcchbjm/AdGuardHome'"
    'runs-on': 'ubuntu-latest'
    'needs': 'test'
    'env':
      'GO111MODULE': 'on'
      'GOPROXY': 'https://goproxy.cn|direct'
    'steps':
    - 'name': 'Checkout'
      'uses': 'actions/checkout@v7'
      'with':
        'fetch-depth': 0
    - 'name': 'Set up Go'
      # Don't add a manual actions/cache step for ~/go/pkg/mod: setup-go
      # already caches it (plus the build cache) and restores it first.
      # Restoring the same path twice makes GNU tar fail with
      # "Cannot open: File exists" on Go's read-only module directories.
      'uses': 'actions/setup-go@v7'
      'with':
        'go-version': '${{ env.GO_VERSION }}'
    - 'name': 'Set up Node'
      'uses': 'actions/setup-node@v7'
      'with':
        'node-version': '${{ env.NODE_VERSION }}'
    - 'name': 'Set up npm cache'
      'uses': 'actions/cache@v6'
      'with':
        'path': '~/.npm'
        'key': "${{ runner.os }}-node-${{ hashFiles('client_v2/package-lock.json') }}"
        'restore-keys': '${{ runner.os }}-node-'
    # VERSION：用 tag 名作为发行号。须配合 make -e：Makefile 里写了 VERSION=v0.0.0，
    # GNU Make 默认不会用环境变量覆盖该赋值；不设 -e 时会仍用 v0.0.0 并调用 version.sh → git describe（fork 上易失败）。
    # SIGN=0：跳过 GPG / Windows 可执行文件签名。
    - 'name': 'Build release archives'
      'env':
        'VERSION': '${{ github.ref_name }}'
        'VERSION_DOWNLOAD_URL': 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
        'ANNOUNCEMENT_URL': 'https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}'
        'UPDATE_INDEX_URL': 'https://github.com/${{ github.repository }}/releases/latest/download/version.json'
      'run': 'make -e CLIENT_DIR=client_v2 SIGN=0 VERBOSE=1 CHANNEL=release deps build-release pack-release'
    - 'name': 'Set up QEMU'
      'uses': 'docker/setup-qemu-action@v4'
    - 'name': 'Set up Docker Buildx'
      'uses': 'docker/setup-buildx-action@v4'
    - 'name': 'Login to GHCR'
      'uses': 'docker/login-action@v4'
      'with':
        'registry': 'ghcr.io'
        'username': '${{ github.actor }}'
        'password': '${{ secrets.GITHUB_TOKEN }}'
    - 'name': 'Build and push Docker image to GHCR'
      'env':
        'VERSION': '${{ github.ref_name }}'
      'run': >-
        make -e SIGN=0 VERBOSE=1 CHANNEL=release
        DOCKER_IMAGE_NAME=ghcr.io/fcchbjm/adguardhome
        DOCKER_PUSH=1 build-docker
    - 'name': 'Publish GitHub Release'
      'uses': 'softprops/action-gh-release@v3'
      'with':
        'tag_name': '${{ github.ref_name }}'
        'name': '${{ github.ref_name }}'
        # Let GitHub generate the notes from the commits and pull requests, then
        # edit the release body by hand if it needs more context.  Don't point
        # body_path at a file: the fork does not keep per-release notes in the
        # repository, and a missing file fails the step.
        'generate_release_notes': true
        'files': |
          dist/*.zip
          dist/*.tar.gz
          dist/checksums.txt
          dist/version.txt
          dist/version.json
          dist/AdGuardHome_frontend.tar.gz
