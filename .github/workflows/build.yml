# Frontend tests and builds use client_v2 (SolidJS).
'name': 'build'
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
'env':
  'GO_VERSION': '1.27.4'
  'NODE_VERSION': '24'
'on':
  'push':
    'branches':
      - '*'
    'tags':
      - 'v*'
  'pull_request':
'jobs':
  'test':
    'runs-on': '${{ matrix.os }}'
    'permissions':
      'contents': 'read'
    'env':
      'GO111MODULE': 'on'
      'GOPROXY': 'https://goproxy.cn'
    'strategy':
      'fail-fast': false
      'matrix':
        'os':
          - 'ubuntu-latest'
          - 'macOS-latest'
          - 'windows-latest'
    'steps':
      - 'name': 'Checkout'
        'uses': 'actions/checkout@v7'
        'with':
          'fetch-depth': 0
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set up Go'
        # Don't add a manual actions/cache step for ~/go/pkg/mod: setup-go
        # already caches it (plus the build cache) and restores it first.
        # Restoring the same path twice makes GNU tar fail with
        # "Cannot open: File exists" on Go's read-only module directories.
        'uses': 'actions/setup-go@v7'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'Set up Node'
        'uses': 'actions/setup-node@v7'
        'with':
          'node-version': '${{ env.NODE_VERSION }}'
      - 'name': 'Set up npm cache'
        'uses': 'actions/cache@v6'
        'with':
          # Use the default npm cache directory directly instead of querying it
          # with a step, since the set-output command is deprecated.
          'path': '~/.npm'
          'key': "${{ runner.os }}-node-${{ hashFiles('client_v2/package-lock.json') }}"
          'restore-keys': '${{ runner.os }}-node-'
      - 'name': 'Run tests'
        'shell': 'bash'
        'run': 'make CLIENT_DIR=client_v2 VERBOSE=1 deps test go-bench go-fuzz'
      - 'name': 'Upload coverage reports to Codecov'
        'uses': 'codecov/codecov-action@v7'
        'if': "success() && matrix.os == 'ubuntu-latest'"
        'with':
          'token': '${{ secrets.CODECOV_TOKEN }}'
          'slug': 'fcchbjm/AdGuardHome'
          'files': './cover.out'
  'build-release':
    'runs-on': 'ubuntu-latest'
    'needs': 'test'
    'permissions':
      'contents': 'read'
    'steps':
      - 'name': 'Checkout'
        'uses': 'actions/checkout@v7'
        'with':
          'fetch-depth': 0
          # Set to false to avoid  GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set up Go'
        # Don't add a manual actions/cache step for ~/go/pkg/mod: setup-go
        # already caches it (plus the build cache) and restores it first.
        # Restoring the same path twice makes GNU tar fail with
        # "Cannot open: File exists" on Go's read-only module directories.
        'uses': 'actions/setup-go@v7'
        'with':
          'go-version': '${{ env.GO_VERSION }}'
      - 'name': 'Set up Node'
        'uses': 'actions/setup-node@v7'
        'with':
          'node-version': '${{ env.NODE_VERSION }}'
      - 'name': 'Set up npm cache'
        'uses': 'actions/cache@v6'
        'with':
          'path': '~/.npm'
          'key': "${{ runner.os }}-node-${{ hashFiles('client_v2/package-lock.json') }}"
          'restore-keys': '${{ runner.os }}-node-'
      - 'name': 'Set up Snapcraft'
        'run': 'sudo snap install snapcraft --classic'
      - 'name': 'Set up QEMU'
        'uses': 'docker/setup-qemu-action@v4'
      - 'name': 'Set up Docker Buildx'
        # Don't set the deprecated "install" input: build-docker.sh already calls
        # "docker buildx build" explicitly.
        'uses': 'docker/setup-buildx-action@v4'
      - 'name': 'Run snapshot build'
        # Set a custom version string, since the checkout action does not seem
        # to know about the master branch, while the version script uses it to
        # count the number of commits within the branch.
        'run': 'make SIGN=0 VERBOSE=1 VERSION="v0.0.0-github" build-release build-docker'
  'notify':
    'needs':
      - 'build-release'
    # Secrets are not passed to workflows that are triggered by a pull request
    # from a fork.
    #
    # Use always() to signal to the runner that this job must run even if the
    # previous ones failed.
    'if': |
      ${{
        always() &&
        github.repository_owner == 'AdguardTeam' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    'runs-on': 'ubuntu-latest'
    'permissions':
      # Required by workflow-conclusion-action to check workflow status.
      'actions': 'read'
      'contents': 'read'
    'steps':
      - 'name': 'Conclusion'
        'uses': 'technote-space/workflow-conclusion-action@v1'
      - 'name': 'Send Slack notif'
        'uses': '8398a7/action-slack@v3'
        'with':
          'status': '${{ env.WORKFLOW_CONCLUSION }}'
          'fields': 'repo, message, commit, author, workflow'
        'env':
          'GITHUB_TOKEN': '${{ secrets.GITHUB_TOKEN }}'
          'SLACK_WEBHOOK_URL': '${{ secrets.SLACK_WEBHOOK_URL }}'
